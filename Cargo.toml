[package]
name = "rustl"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
simple_logger = "5.0"
log = "0.4"
cfg-if = "1"
wgpu = "24.0"
bytemuck = { version = "1.23", features = [ "derive" ] }
instant = "0.1"
winit = "0.30.10"
anyhow = "1.0"
nalgebra = "0.33"
sha256 = "1.6.0"
colored = "3.0.0"
base64 = "0.22"
strum = "0.27"
strum_macros = "0.27"
rfd = "0.15"
serde = "1.0"
serde_json = "1.0"
regex = "1.11"
rodio = "0.20"
gilrs = { version = "0.11", features = ["wgi"]}
take_mut = "0.2"
uuid = {version = "1.15", features = ["v4"] }

parry3d = "0.21"
bvh = "0.11.0"

arboard = "3.5.0"

tobj = { version = "4.0", features = ["async"]}

gltf = { version = "1.4", features = [
#gltf = { git = "https://github.com/gltf-rs/gltf", features = [
  "extras",
  "names",
  "KHR_lights_punctual",
  "KHR_materials_specular",
  "KHR_materials_ior",
  "KHR_materials_unlit",
  "KHR_texture_transform",
  "KHR_materials_emissive_strength"
]}

# jpeg decoder that image includes uses rayon to speed up the decoding with threads. WASM doesn't support threads currently so we need to disable this so that our code won't crash when we try to load a jpeg on the web.
image = { version = "0.25", default-features = false, features = [ "png", "jpeg"] }
# image = "0.24.5"

egui = "0.31"
egui-wgpu = "0.31"
egui_plot = "0.31"
#egui = { git = "https://github.com/emilk/egui", branch = "master"  }
#egui-wgpu = { git = "https://github.com/emilk/egui", branch = "master" }
#egui_plot = { git = "https://github.com/emilk/egui_plot", branch = "main" }

#[patch.crates-io]
#egui_plot = { git = "https://github.com/emilk/egui_plot", branch = "main" }
#egui = { git = "https://github.com/emilk/egui", branch = "master" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.31"
#egui-winit = { git ="https://github.com/emilk/egui", branch = "master" }
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
reqwest = "0.12"
wgpu = { version = "25.0.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
wasm_thread = { version = "0.3", features = ["es_modules"]}

#egui-winit = { git ="https://github.com/emilk/egui", default-features = false, branch = "master", features = [
egui-winit = { version = "0.31", default-features = false, features = [
  "links",
] }

[build-dependencies]
fs_extra = "1.3"
glob = "0.3"
anyhow = "1.0"