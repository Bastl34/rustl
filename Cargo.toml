[package]
name = "rustl"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/Bastl34/rustl"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
simple_logger = "5.2.0"
log = "0.4.33"
cfg-if = "1.0.4"
wgpu = "29.0.4"
bytemuck = { version = "1.25.2", features = [ "derive" ] }
web-time = "1.1.0"
winit = "0.30.13"
anyhow = "1.0.103"
nalgebra = { version = "0.35.0", features = ["serde-serialize", "convert-glam033"] }
colored = "3.1.1"
base64 = "0.23.0"
strum = "0.28.0"
strum_macros = "0.28.0"
rfd = "0.17.2"
chrono = "0.4.45"
urlencoding = "2.1.2"

serde = "1.0.229"
serde_json = "1.0.151"
typetag = "0.2.23"

regex = "1.13.0"
# use lewton for ogg (symphonia-vorbis can not seek or loop properly)
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "mp4", "lewton", "wav"] }
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"]}
take_mut = "0.2.2"
uuid = {version = "1.23.4", features = ["v4"] }

xxhash-rust = { version = "0.8.16", features = [ "xxh3"] }

parry3d = "0.28.0"

arboard = "3.6.1"

tobj = { version = "4.0.4", features = ["async"]}

#gltf = { version = "1.4", features = [
gltf = { git = "https://github.com/gltf-rs/gltf", rev = "3def30c9caf96f2dbc85238179ea5a6152c5cf22", features = [
  "extras",
  "names",
  "KHR_lights_punctual",
  "KHR_materials_specular",
  "KHR_materials_ior",
  "KHR_materials_unlit",
  "KHR_texture_transform",
  "KHR_materials_emissive_strength",
  "KHR_materials_pbrSpecularGlossiness",
  "EXT_texture_webp"
]}

# jpeg decoder that image includes uses rayon to speed up the decoding with threads. WASM doesn't support threads currently so we need to disable this so that our code won't crash when we try to load a jpeg on the web.
image = { version = "0.25.10", default-features = false, features = [ "png", "jpeg", "webp"] }
# image = "0.24.5"

egui = "0.35.0"
egui-wgpu = "0.35.0"
egui_plot = "0.36.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
#egui = { git = "https://github.com/emilk/egui", branch = "main"  }
#egui-wgpu = { git = "https://github.com/emilk/egui", branch = "main" }
#egui_extras = { git = "https://github.com/emilk/egui", branch = "main" }
#egui_plot = { git = "https://github.com/emilk/egui_plot", branch = "main" }

#[patch.crates-io]
#egui_plot = { git = "https://github.com/emilk/egui_plot", branch = "main" }
#egui = { git = "https://github.com/emilk/egui", branch = "main" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.35.0"
#egui-winit = { git ="https://github.com/emilk/egui", branch = "main" }
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
reqwest = "0.13.4"
wgpu = { version = "29.0.4", features = ["webgl"]}
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
wasm_thread = { version = "0.3.3", features = ["es_modules"]}

#egui-winit = { git ="https://github.com/emilk/egui", default-features = false, branch = "main", features = [
egui-winit = { version = "0.35.0", default-features = false, features = [
  "links",
]}

[build-dependencies]
fs_extra = "1.3.0"
glob = "0.3.4"
anyhow = "1.0.103"

[profile.dev-fast]
inherits = "dev"
incremental = true

[profile.dev-fast.package."*"]
opt-level = 3

[profile.dev-fast.package.rustl]
opt-level = 0
