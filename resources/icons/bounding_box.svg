<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <!-- bounding box: corner brackets around an isometric cube -->
    <g style="fill:none;stroke:white;stroke-width:1.6px;">
        <!-- corner brackets (the box hull) -->
        <path d="M3,7.5L3,3L7.5,3"/>
        <path d="M16.5,3L21,3L21,7.5"/>
        <path d="M21,16.5L21,21L16.5,21"/>
        <path d="M7.5,21L3,21L3,16.5"/>
    </g>

    <!-- the enclosed object: isometric cube -->
    <g style="fill:none;stroke:white;stroke-width:1.5px;">
        <!-- top face -->
        <path d="M12,6.6L16.4,8.9L12,11.2L7.6,8.9Z"/>
        <!-- verticals -->
        <path d="M7.6,8.9L7.6,14.6"/>
        <path d="M16.4,8.9L16.4,14.6"/>
        <path d="M12,11.2L12,16.9"/>
        <!-- bottom edges -->
        <path d="M7.6,14.6L12,16.9L16.4,14.6"/>
    </g>
</svg>
