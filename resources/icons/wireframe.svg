<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <!-- low-poly icosahedron: outer pentagon + inner pentagon + zigzag triangulation -->
    <g style="fill:none;stroke:white;stroke-width:1.4px;">
        <!-- outer pentagon (silhouette) -->
        <path d="M12,3L20.6,9.2L17.3,19.3L6.7,19.3L3.4,9.2Z"/>
        <!-- inner pentagon (front-facing facets ring) -->
        <path d="M12,16L8.2,13.2L9.7,8.8L14.4,8.8L15.8,13.2Z" style="stroke-width:1.2px;"/>
        <!-- triangulation: each outer vertex to its two adjacent inner vertices -->
        <g style="stroke-width:1.2px;">
            <path d="M12,3L14.4,8.8"/>
            <path d="M12,3L9.7,8.8"/>
            <path d="M3.4,9.2L9.7,8.8"/>
            <path d="M3.4,9.2L8.2,13.2"/>
            <path d="M6.7,19.3L8.2,13.2"/>
            <path d="M6.7,19.3L12,16"/>
            <path d="M17.3,19.3L12,16"/>
            <path d="M17.3,19.3L15.8,13.2"/>
            <path d="M20.6,9.2L15.8,13.2"/>
            <path d="M20.6,9.2L14.4,8.8"/>
        </g>
    </g>
</svg>
