<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <!-- physics volumes: a capsule collider next to a sphere and a box collider -->
    <g style="fill:none;stroke:white;stroke-width:1.5px;">
        <!-- capsule with the rings where its caps start -->
        <rect x="3.5" y="3" width="7" height="18" rx="3.5" ry="3.5"/>
        <path d="M3.5,6.5C3.5,7.7 10.5,7.7 10.5,6.5"/>
        <path d="M3.5,17.5C3.5,18.7 10.5,18.7 10.5,17.5"/>

        <!-- sphere with its equator -->
        <circle cx="17.5" cy="7" r="3.5"/>
        <path d="M14,7C14,8.3 21,8.3 21,7"/>

        <!-- box -->
        <rect x="14" y="14" width="7" height="7"/>
    </g>
</svg>
