<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">PCF: average several comparisons for soft edges</text>

  <!-- left: single sample -->
  <rect x="30" y="55" width="340" height="310" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="200" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">1 comparison</text>

  <!-- hard edge result -->
  <rect x="70" y="110" width="130" height="130" fill="#0f172a"/>
  <rect x="200" y="110" width="130" height="130" fill="#fde68a"/>
  <text x="200" y="262" text-anchor="middle" font-size="12" fill="#64748b">result is 0 or 1 — nothing in between</text>
  <text x="200" y="282" text-anchor="middle" font-size="12" fill="#64748b">edges look hard and blocky (map texels visible)</text>

  <!-- right: 3x3 PCF -->
  <rect x="390" y="55" width="340" height="310" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="560" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">3×3 kernel (PCF)</text>

  <!-- 3x3 grid of taps -->
  <g>
    <rect x="425" y="105" width="42" height="42" fill="#fde68a" stroke="#e2e8f0"/>
    <rect x="467" y="105" width="42" height="42" fill="#fde68a" stroke="#e2e8f0"/>
    <rect x="509" y="105" width="42" height="42" fill="#0f172a" stroke="#e2e8f0"/>
    <rect x="425" y="147" width="42" height="42" fill="#fde68a" stroke="#e2e8f0"/>
    <rect x="467" y="147" width="42" height="42" fill="#0f172a" stroke="#e2e8f0"/>
    <rect x="509" y="147" width="42" height="42" fill="#0f172a" stroke="#e2e8f0"/>
    <rect x="425" y="189" width="42" height="42" fill="#fde68a" stroke="#e2e8f0"/>
    <rect x="467" y="189" width="42" height="42" fill="#0f172a" stroke="#e2e8f0"/>
    <rect x="509" y="189" width="42" height="42" fill="#0f172a" stroke="#e2e8f0"/>
  </g>
  <circle cx="488" cy="168" r="6" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="488" y="252" text-anchor="middle" font-size="12" fill="#64748b">9 taps per fragment</text>
  <text x="488" y="270" text-anchor="middle" font-size="12" fill="#64748b">4 lit / 5 shadowed → 0.44</text>

  <!-- gradient result -->
  <defs>
    <linearGradient id="soft" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect x="590" y="105" width="120" height="126" fill="url(#soft)" rx="4"/>
  <text x="650" y="252" text-anchor="middle" font-size="12" fill="#64748b">edge becomes</text>
  <text x="650" y="270" text-anchor="middle" font-size="12" fill="#64748b">a gradient</text>

  <text x="380" y="392" text-anchor="middle" font-size="12.5" fill="#334155">a comparison sampler does a free 2×2 PCF per tap in hardware — the 3×3 kernel smooths on top of that</text>
</svg>
