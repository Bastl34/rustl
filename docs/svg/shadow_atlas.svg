<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Shadow atlas: one depth texture array, one layer per shadow view</text>

  <!-- lights -->
  <!-- directional -->
  <circle cx="80" cy="110" r="14" fill="#f6b73c"/>
  <g stroke="#f6b73c" stroke-width="2.5" stroke-linecap="round">
    <line x1="80" y1="88" x2="80" y2="80"/><line x1="102" y1="110" x2="110" y2="110"/><line x1="58" y1="110" x2="50" y2="110"/>
    <line x1="96" y1="94" x2="102" y2="88"/><line x1="64" y1="94" x2="58" y2="88"/>
  </g>
  <text x="130" y="106" font-size="13.5" font-weight="600" fill="#1e293b">Directional</text>
  <text x="130" y="123" font-size="12" fill="#64748b">3 cascades</text>

  <!-- spot -->
  <path d="M72 200 L110 182 L110 218 Z" fill="#f6b73c"/>
  <circle cx="72" cy="200" r="7" fill="#b45309"/>
  <text x="130" y="196" font-size="13.5" font-weight="600" fill="#1e293b">Spot</text>
  <text x="130" y="213" font-size="12" fill="#64748b">1 view</text>

  <!-- point -->
  <circle cx="80" cy="290" r="12" fill="#f6b73c"/>
  <g stroke="#f6b73c" stroke-width="2.5" stroke-linecap="round">
    <line x1="80" y1="270" x2="80" y2="262"/><line x1="80" y1="310" x2="80" y2="318"/>
    <line x1="100" y1="290" x2="108" y2="290"/><line x1="60" y1="290" x2="52" y2="290"/>
    <line x1="94" y1="276" x2="100" y2="270"/><line x1="66" y1="276" x2="60" y2="270"/>
    <line x1="94" y1="304" x2="100" y2="310"/><line x1="66" y1="304" x2="60" y2="310"/>
  </g>
  <text x="130" y="286" font-size="13.5" font-weight="600" fill="#1e293b">Point</text>
  <text x="130" y="303" font-size="12" fill="#64748b">6 cube faces</text>

  <!-- arrows -->
  <line x1="225" y1="110" x2="290" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="225" y1="200" x2="290" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="225" y1="290" x2="290" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- layer stack -->
  <g font-size="12.5" text-anchor="middle">
    <!-- cascades -->
    <rect x="300" y="70"  width="360" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="480" y="92" fill="#14532d">layer 0 — cascade 0 (near, sharp)</text>
    <rect x="300" y="108" width="360" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="480" y="130" fill="#14532d">layer 1 — cascade 1</text>
    <rect x="300" y="146" width="360" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="480" y="168" fill="#14532d">layer 2 — cascade 2 (far, coarse)</text>
    <!-- spot -->
    <rect x="300" y="184" width="360" height="34" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
    <text x="480" y="206" fill="#92400e">layer 3 — spot view</text>
    <!-- point -->
    <rect x="300" y="222" width="360" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="480" y="244" fill="#1e3a8a">layer 4 — point +X</text>
    <rect x="300" y="260" width="360" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="480" y="282" fill="#1e3a8a">layer 5 — point −X</text>
    <rect x="300" y="298" width="360" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="480" y="320" fill="#1e3a8a">layers 6…9 — point ±Y, ±Z</text>
  </g>

  <text x="380" y="362" text-anchor="middle" font-size="12.5" fill="#64748b">every light stores its first layer index — the shader picks its layers from there</text>
</svg>
