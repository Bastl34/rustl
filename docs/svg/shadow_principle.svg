<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Shadow mapping: compare distances against the light's depth map</text>

  <!-- ground -->
  <line x1="120" y1="330" x2="720" y2="330" stroke="#94a3b8" stroke-width="3"/>
  <!-- shadow on ground -->
  <rect x="402" y="326" width="264" height="8" fill="#334155" rx="4"/>
  <text x="534" y="352" text-anchor="middle" font-size="12" fill="#64748b">shadow</text>

  <!-- light -->
  <circle cx="90" cy="70" r="18" fill="#f6b73c"/>
  <g stroke="#f6b73c" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="40" x2="90" y2="28"/>
    <line x1="120" y1="70" x2="132" y2="70"/>
    <line x1="60"  y1="70" x2="48"  y2="70"/>
    <line x1="111" y1="49" x2="120" y2="40"/>
    <line x1="69"  y1="49" x2="60"  y2="40"/>
    <line x1="111" y1="91" x2="120" y2="100"/>
  </g>
  <text x="90" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">Light</text>

  <!-- shadow map plane -->
  <line x1="180" y1="80" x2="180" y2="290" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#8b5cf6" stroke-width="1.5" opacity="0.5">
    <line x1="173" y1="105" x2="187" y2="105"/>
    <line x1="173" y1="130" x2="187" y2="130"/>
    <line x1="173" y1="155" x2="187" y2="155"/>
    <line x1="173" y1="180" x2="187" y2="180"/>
    <line x1="173" y1="205" x2="187" y2="205"/>
    <line x1="173" y1="230" x2="187" y2="230"/>
    <line x1="173" y1="255" x2="187" y2="255"/>
  </g>
  <text x="180" y="313" text-anchor="middle" font-size="12" fill="#7c3aed" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">shadow map</text>
  <text x="180" y="328" text-anchor="middle" font-size="11" fill="#7c3aed" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">(depth per texel)</text>

  <!-- occluder -->
  <rect x="330" y="210" width="70" height="60" fill="#64748b" rx="6"/>
  <text x="365" y="200" text-anchor="middle" font-size="12" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">occluder</text>

  <!-- ray 1: blocked -->
  <line x1="104" y1="78" x2="330" y2="222" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="330" y1="222" x2="500" y2="330" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" opacity="0.65"/>
  <circle cx="330" cy="222" r="4.5" fill="#ef4444"/>
  <line x1="150" y1="243" x2="176" y2="133" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="25" y="258" font-size="11.5" fill="#b91c1c">stored: depth of occluder</text>

  <!-- ray 2: free -->
  <line x1="106" y1="74" x2="700" y2="330" stroke="#10b981" stroke-width="2.5"/>

  <!-- crossings on the map -->
  <rect x="174" y="121" width="12" height="12" fill="#ef4444" rx="2"/>
  <rect x="174" y="103" width="12" height="12" fill="#10b981" rx="2"/>

  <!-- sample points -->
  <circle cx="500" cy="330" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <text x="500" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">P1: farther than stored depth</text>
  <text x="500" y="392" text-anchor="middle" font-size="12.5" fill="#b91c1c">→ in shadow</text>

  <circle cx="700" cy="330" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <text x="682" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#047857">P2: nothing in between</text>
  <text x="682" y="392" text-anchor="middle" font-size="12.5" fill="#047857">→ lit</text>
</svg>
