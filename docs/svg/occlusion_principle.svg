<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="oc_arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Frustum culling vs. occlusion culling</text>

  <!-- camera -->
  <g>
    <rect x="40" y="185" width="46" height="34" fill="#334155" rx="5"/>
    <path d="M86 192 L104 184 L104 220 L86 212 z" fill="#334155"/>
    <text x="63" y="245" text-anchor="middle" font-size="12" fill="#334155">camera</text>
  </g>

  <!-- frustum -->
  <line x1="104" y1="200" x2="690" y2="70" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="104" y1="200" x2="690" y2="330" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="655" y="58" text-anchor="end" font-size="11.5" fill="#64748b">view frustum</text>

  <!-- wall (occluder) -->
  <rect x="330" y="130" width="26" height="150" fill="#475569" rx="4"/>
  <text x="343" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">wall</text>

  <!-- visible object in front of the wall -->
  <circle cx="240" cy="230" r="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="240" y="273" text-anchor="middle" font-size="11.5" fill="#059669">drawn</text>

  <!-- occluded object behind the wall -->
  <circle cx="480" cy="205" r="24" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="480" y="199" text-anchor="middle" font-size="10.5" fill="#e11d48">hidden by</text>
  <text x="480" y="213" text-anchor="middle" font-size="10.5" fill="#e11d48">the wall</text>
  <text x="480" y="252" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e11d48">occlusion culled</text>

  <!-- visible object behind the wall but not covered -->
  <circle cx="560" cy="115" r="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="560" y="86" text-anchor="middle" font-size="11.5" fill="#059669">drawn</text>

  <!-- object outside the frustum -->
  <circle cx="220" cy="88" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="220" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">frustum culled (CPU)</text>

  <!-- sight ray blocked -->
  <line x1="104" y1="200" x2="330" y2="203" stroke="#e11d48" stroke-width="1.6"/>
  <line x1="330" y1="203" x2="456" y2="205" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="3 4"/>
  <text x="196" y="192" font-size="10.5" fill="#e11d48">sight line blocked</text>

  <!-- caption -->
  <rect x="40" y="336" width="680" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="380" y="355" text-anchor="middle" font-size="12.5" fill="#334155">Frustum culling removes what is outside the view — occlusion culling additionally removes</text>
  <text x="380" y="372" text-anchor="middle" font-size="12.5" fill="#334155">what is inside the view but completely hidden behind other geometry.</text>
</svg>
