<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="oc_arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Testing one object against the HZB</text>

  <!-- left: projection -->
  <g>
    <text x="150" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1 · project the bounding box</text>

    <!-- screen -->
    <rect x="55" y="88" width="190" height="140" fill="#ffffff" stroke="#94a3b8" stroke-width="2" rx="6"/>
    <text x="150" y="248" text-anchor="middle" font-size="11.5" fill="#64748b">screen (clamped to the viewport)</text>

    <!-- projected box -->
    <rect x="115" y="120" width="80" height="66" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="115" cy="120" r="3.5" fill="#2563eb"/>
    <circle cx="195" cy="120" r="3.5" fill="#2563eb"/>
    <circle cx="115" cy="186" r="3.5" fill="#2563eb"/>
    <circle cx="195" cy="186" r="3.5" fill="#2563eb"/>
    <text x="155" y="112" text-anchor="middle" font-size="11" fill="#2563eb">screen rect of all 8 corners</text>
    <text x="155" y="204" text-anchor="middle" font-size="11" fill="#2563eb">+ closest depth (e.g. 0.6)</text>
  </g>

  <line x1="260" y1="155" x2="310" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#oc_arrow4)"/>

  <!-- middle: mip selection + 4 samples -->
  <g>
    <text x="435" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">2 · sample the fitting HZB mip</text>

    <!-- coarse mip grid 3x3 -->
    <g>
      <rect x="360" y="88"  width="50" height="50" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="410" y="88"  width="50" height="50" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="460" y="88"  width="50" height="50" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="360" y="138" width="50" height="50" fill="#fde68a" stroke="#f59e0b"/>
      <rect x="410" y="138" width="50" height="50" fill="#fde68a" stroke="#f59e0b"/>
      <rect x="460" y="138" width="50" height="50" fill="#fef3c7" stroke="#f59e0b"/>
      <rect x="360" y="188" width="50" height="50" fill="#fde68a" stroke="#f59e0b"/>
      <rect x="410" y="188" width="50" height="50" fill="#fde68a" stroke="#f59e0b"/>
      <rect x="460" y="188" width="50" height="50" fill="#fef3c7" stroke="#f59e0b"/>
    </g>

    <!-- rect over ~2x2 texels -->
    <rect x="385" y="125" width="88" height="80" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4"/>

    <!-- 4 sample points -->
    <circle cx="392" cy="132" r="5" fill="#e11d48"/>
    <circle cx="466" cy="132" r="5" fill="#e11d48"/>
    <circle cx="392" cy="198" r="5" fill="#e11d48"/>
    <circle cx="466" cy="198" r="5" fill="#e11d48"/>

    <text x="435" y="258" text-anchor="middle" font-size="11.5" fill="#64748b">mip is chosen so the rect covers ≤ 2×2 texels</text>
    <text x="435" y="274" text-anchor="middle" font-size="11.5" fill="#64748b">→ 4 samples cover it, max = farthest occluder (e.g. 0.3)</text>
  </g>

  <line x1="525" y1="155" x2="575" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#oc_arrow4)"/>

  <!-- right: compare -->
  <g>
    <text x="650" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">3 · compare</text>

    <rect x="585" y="88" width="140" height="74" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="8"/>
    <text x="655" y="113" text-anchor="middle" font-size="12" fill="#065f46" font-family="ui-monospace, Menlo, monospace">closest ≤ hzb</text>
    <text x="655" y="132" text-anchor="middle" font-size="12" fill="#065f46">object can peek past</text>
    <text x="655" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">→ visible</text>

    <rect x="585" y="176" width="140" height="74" fill="#fff1f2" stroke="#e11d48" stroke-width="2" rx="8"/>
    <text x="655" y="201" text-anchor="middle" font-size="12" fill="#9f1239" font-family="ui-monospace, Menlo, monospace">closest &gt; hzb</text>
    <text x="655" y="220" text-anchor="middle" font-size="11" fill="#9f1239">fully behind occluders</text>
    <text x="655" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#e11d48">→ culled  (0.6 &gt; 0.3)</text>
  </g>

  <!-- caption -->
  <rect x="40" y="306" width="680" height="94" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="56" y="330" font-size="12.5" font-weight="700" fill="#1e293b">Always err on the side of "visible" (conservative rules):</text>
  <text x="56" y="351" font-size="12" fill="#334155">· a corner behind the camera, the box crossing the near plane or a rect fully outside the viewport → visible</text>
  <text x="56" y="369" font-size="12" fill="#334155">· objects without depth test and objects with the per-node "occlusion culling" toggle off are never tested</text>
  <text x="56" y="387" font-size="12" fill="#334155">· wrongly drawing a hidden object only costs performance — wrongly culling a visible one is a rendering bug</text>
</svg>
