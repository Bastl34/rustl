<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#f8fafc" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Two passes per shadow view</text>

  <!-- pass 1 -->
  <rect x="30" y="60" width="700" height="130" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="50" y="88" font-size="14" font-weight="700" fill="#7c3aed">Pass 1 — render from the light</text>

  <rect x="50" y="105" width="220" height="62" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" rx="8"/>
  <text x="160" y="131" text-anchor="middle" font-size="12.5" fill="#1e293b">draw all shadow casters</text>
  <text x="160" y="149" text-anchor="middle" font-size="12.5" fill="#64748b">depth only, no colors</text>

  <line x1="270" y1="136" x2="330" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- mini depth map -->
  <g>
    <rect x="340" y="102" width="70" height="70" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5" rx="6"/>
    <rect x="352" y="118" width="26" height="26" fill="#7c3aed" rx="3"/>
    <rect x="380" y="136" width="20" height="24" fill="#a78bfa" rx="3"/>
    <text x="375" y="188" text-anchor="middle" font-size="11.5" fill="#7c3aed">shadow map</text>
  </g>

  <text x="440" y="130" font-size="12.5" fill="#334155">each texel stores the distance of the</text>
  <text x="440" y="148" font-size="12.5" fill="#334155">closest surface, as seen from the light</text>

  <!-- pass 2 -->
  <rect x="30" y="215" width="700" height="160" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="50" y="243" font-size="14" font-weight="700" fill="#2563eb">Pass 2 — render from the camera</text>

  <rect x="50" y="262" width="180" height="62" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="140" y="288" text-anchor="middle" font-size="12.5" fill="#1e293b">fragment at</text>
  <text x="140" y="306" text-anchor="middle" font-size="12.5" fill="#1e293b">world position P</text>

  <line x1="230" y1="293" x2="285" y2="293" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="295" y="262" width="200" height="62" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="395" y="288" text-anchor="middle" font-size="12.5" fill="#1e293b">project P with the light's</text>
  <text x="395" y="306" text-anchor="middle" font-size="12.5" font-style="italic" fill="#334155">view_proj → uv + depth</text>

  <line x1="495" y1="293" x2="550" y2="293" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="552" y="255" width="178" height="44" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="641" y="282" text-anchor="middle" font-size="12" fill="#b91c1c">depth &gt; stored → shadow</text>

  <rect x="552" y="307" width="178" height="44" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="641" y="334" text-anchor="middle" font-size="12" fill="#047857">depth ≤ stored → lit</text>
</svg>
